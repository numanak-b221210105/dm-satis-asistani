<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
